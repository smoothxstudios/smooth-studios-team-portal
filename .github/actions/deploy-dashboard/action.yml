name: Deploy dashboard with Pages recovery
description: Release orphaned deployments and retry a temporary publishing failure once.
outputs:
  page_url:
    description: Published dashboard URL
    value: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Recover unfinished Pages deployments
      uses: actions/github-script@v8
      with:
        script: |
          const { recoverPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-recovery.mjs`);
          await recoverPages({ github, context, core });
    - name: Publish dashboard
      id: first
      continue-on-error: true
      uses: actions/deploy-pages@v4
    - name: Wait for failed deployment cleanup
      if: ${{ steps.first.outcome == 'failure' }}
      uses: actions/github-script@v8
      with:
        script: |
          const { recoverPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-recovery.mjs`);
          await recoverPages({ github, context, core });
          await new Promise(resolve => setTimeout(resolve, 15000));
    - name: Retry dashboard publication
      id: retry
      if: ${{ steps.first.outcome == 'failure' }}
      uses: actions/deploy-pages@v4
    - name: Release failed or cancelled deployment
      if: ${{ failure() || cancelled() }}
      uses: actions/github-script@v8
      with:
        script: |
          const { recoverPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-recovery.mjs`);
          await recoverPages({ github, context, core, currentOnly: true });
