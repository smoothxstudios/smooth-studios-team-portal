name: Deploy dashboard with Pages recovery
description: Release orphaned deployments and publish with a fresh identity for each bounded attempt.
outputs:
  page_url:
    description: Published dashboard URL
    value: ${{ steps.publish.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Recover unfinished Pages deployments
      uses: actions/github-script@v8
      with:
        script: |
          const { recoverPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-recovery.mjs`);
          await recoverPages({ github, context, core });
    - name: Publish dashboard
      id: publish
      uses: actions/github-script@v8
      with:
        script: |
          const { publishPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-publish.mjs`);
          await publishPages({ github, context, core });
    - name: Release failed or cancelled deployment
      if: ${{ failure() || cancelled() }}
      uses: actions/github-script@v8
      with:
        script: |
          const { recoverPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pages-recovery.mjs`);
          await recoverPages({ github, context, core, currentOnly: true });
