name: Requested payment notice follow-up
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payment-notice-followup-20261110.yml"
      - "scripts/payment-notice-followup-20261110.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payment-notice-followup-20261110
  cancel-in-progress: false
jobs:
  follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect today's payment recipients
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          PAYMENT_NOTICE_MODE: preview
        run: node scripts/payment-notice-followup-20261110.mjs
