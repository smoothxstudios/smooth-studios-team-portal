name: Preserve current data for v2.41.1 rollback

on:
  push:
    branches: [main]
    paths: [".github/workflows/prepare-v2411-rollback.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smooth-studios-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and preserve current encrypted snapshots
        env:
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { dashboardStorage } from './scripts/lib/dashboard-storage.mjs';
          import { decryptPayload } from './scripts/lib/dashboard-data.mjs';
          import { validateTeamSettings, teamPasswords } from './scripts/lib/team-settings.mjs';
          const config=JSON.parse(await readFile('config/studio.config.json','utf8'));
          const ownerPassword=process.env.DASHBOARD_PASSWORD_OWNER;
          const settingsEnvelope=await dashboardStorage(ownerPassword,'team-settings');
          if(!settingsEnvelope) throw new Error('Current account settings must be preserved before rollback.');
          const settings=validateTeamSettings(decryptPayload(settingsEnvelope,ownerPassword),config);
          const passwords=teamPasswords(config,settings), outputs=[['team-settings',settingsEnvelope]];
          for(const [id,password] of Object.entries(passwords)) {
            const envelope=await dashboardStorage(ownerPassword,id);
            const payload=decryptPayload(envelope,password);
            if(payload.user?.id!==id || payload.role!==(id==='owner'?'owner':'employee') || !Array.isArray(payload.rentals) || payload.history?.deferred) throw new Error('Full account data verification failed.');
            outputs.push([id,envelope]);
          }
          // Only encrypted envelopes are written. Never log decrypted records or credentials.
          for(const [id,envelope] of outputs) await writeFile(`public/data/${id}.json`,JSON.stringify(envelope)+'\n');
          console.log(`Preserved encrypted settings and ${Object.keys(passwords).length} current dashboards.`);
          JS
      - name: Save a separate rollback data checkpoint
        run: |
          git config user.name "smooth-studios-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "rollback-v2411-data-${GITHUB_RUN_ID}"
          git add public/data
          git commit -m "data: preserve current encrypted accounts for requested v2.41.1 rollback"
          git push origin "HEAD:refs/heads/rollback-v2411-data-${GITHUB_RUN_ID}"
