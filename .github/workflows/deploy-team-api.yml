name: Deploy team scheduling backend

on:
  push:
    branches: [main]
    paths:
      - "team-api/**"
      - "lib/team-*.mjs"
      - "lib/event-planner.mjs"
      - "lib/sync-records.mjs"
      - "scripts/lib/incremental-sync.mjs"
      - "scripts/deploy-team-api.mjs"
      - "scripts/import-studio-reference.mjs"
      - "data/studio-reference-import.json"
      - "data/payroll-advance-import.json"
      - "scripts/lib/payroll-sync.mjs"
      - "scripts/lib/employee-pay.mjs"
      - "scripts/lib/team-settings.mjs"
      - "config/studio.config.json"
      - ".github/workflows/deploy-team-api.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share the data-write lock with imports, while retaining every waiting deploy.
concurrency:
  group: smooth-studios-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  deploy-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - name: Deploy existing Worker and migrate its bound D1 database
        env:
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
        run: node scripts/deploy-team-api.mjs
      - name: Import encrypted studio reference if supplied
        env:
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
        run: node scripts/import-studio-reference.mjs
      - name: Import Calendar and enable scheduling after successful sync
        env:
          TEAM_API_BOOTSTRAP: "true"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          EMPLOYEE_EMAIL_AKIVA: ${{ secrets.EMPLOYEE_EMAIL_AKIVA }}
          EMPLOYEE_EMAIL_JORDYN: ${{ secrets.EMPLOYEE_EMAIL_JORDYN }}
          EMPLOYEE_EMAIL_RAYNE: ${{ secrets.EMPLOYEE_EMAIL_RAYNE }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
        run: npm run sync:calendar
      - name: Save encrypted data and activation flag
        run: |
          git config user.name "smooth-studios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/payout-ledger.json
          git diff --cached --quiet || git commit -m "data: enable live team scheduling"
          # Preserve code changes published while the Calendar import ran.
          git pull --rebase origin main
          git push origin HEAD:main
      - run: npm run build:github-pages
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          name: team-pages-${{ github.run_attempt }}
          path: out

  deploy-pages:
    needs: deploy-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: team-pages-${{ github.run_attempt }}
