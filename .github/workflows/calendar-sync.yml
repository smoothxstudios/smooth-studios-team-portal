name: Sync Smooth Studios Calendar

on:
  push:
    branches: [main]
    paths:
      - "scripts/lib/calendar-assignments.mjs"
      - "scripts/lib/dashboard-data.mjs"
      - "scripts/lib/team-api.mjs"
      - "scripts/lib/incremental-sync.mjs"
      - "lib/sync-records.mjs"
      - "lib/rental-details.mjs"
      - ".github/workflows/calendar-sync.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smooth-studios-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    name: Sync Calendar and save dashboard data
    if: ${{ !contains(github.event.head_commit.message, '[restore-v2.41.1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Calendar, rental team notes, and encrypted dashboards
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          EMPLOYEE_EMAIL_AKIVA: ${{ secrets.EMPLOYEE_EMAIL_AKIVA }}
          EMPLOYEE_EMAIL_JORDYN: ${{ secrets.EMPLOYEE_EMAIL_JORDYN }}
          EMPLOYEE_EMAIL_RAYNE: ${{ secrets.EMPLOYEE_EMAIL_RAYNE }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
        run: npm run sync:calendar
      - name: Save refreshed encrypted data
        run: |
          git config user.name "smooth-studios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/payout-ledger.json
          git diff --cached --quiet || git commit -m "data: refresh encrypted calendar dashboards"
          git pull --rebase origin main
          git push origin HEAD:main
