name: Update Studio Guidelines

on:
  workflow_dispatch:
    inputs:
      guide_envelope:
        description: Owner-encrypted Studio Guidelines update
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smooth-studios-data-writes
  cancel-in-progress: false

jobs:
  update-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Update encrypted Studio Guidelines
        env:
          STUDIO_GUIDE_ENVELOPE: ${{ inputs.guide_envelope }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
        run: npm run guide:update
      - name: Save encrypted Studio Guidelines
        run: |
          git config user.name "smooth-studios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "guide: update studio guidelines"
          git pull --rebase origin main
          git push origin HEAD:main
      - run: npm run build:github-pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
