name: Match Stripe payment to Calendar appointment

on:
  workflow_dispatch:
    inputs:
      charge_key:
        description: Private Stripe payment key
        required: true
        type: string
      event_key:
        description: Private Calendar appointment key
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smooth-studios-data-writes
  cancel-in-progress: false

jobs:
  match-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Save selected Stripe payment match
        env:
          STRIPE_PAYMENT_KEY: ${{ inputs.charge_key }}
          CALENDAR_APPOINTMENT_KEY: ${{ inputs.event_key }}
        run: node scripts/set-stripe-payment-match.mjs --charge "$STRIPE_PAYMENT_KEY" --event "$CALENDAR_APPOINTMENT_KEY"
      - name: Refresh encrypted dashboards
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          EMPLOYEE_EMAIL_AKIVA: ${{ secrets.EMPLOYEE_EMAIL_AKIVA }}
          EMPLOYEE_EMAIL_JORDYN: ${{ secrets.EMPLOYEE_EMAIL_JORDYN }}
          EMPLOYEE_EMAIL_RAYNE: ${{ secrets.EMPLOYEE_EMAIL_RAYNE }}
          DASHBOARD_PASSWORD_OWNER: ${{ secrets.DASHBOARD_PASSWORD_OWNER }}
          DASHBOARD_PASSWORD_AKIVA: ${{ secrets.DASHBOARD_PASSWORD_AKIVA }}
          DASHBOARD_PASSWORD_JORDYN: ${{ secrets.DASHBOARD_PASSWORD_JORDYN }}
          DASHBOARD_PASSWORD_RAYNE: ${{ secrets.DASHBOARD_PASSWORD_RAYNE }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
        run: npm run sync:calendar
      - name: Save match and refreshed dashboards
        run: |
          git config user.name "smooth-studios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stripe-payment-matches.json public/data
          git commit -m "payment: match Stripe charge"
          git push
      - run: npm run build:github-pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
