name: Diagnose team API database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-team-api.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read database readiness without customer or employee data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute smooth-studios-team-db --remote --config team-api/wrangler.jsonc --command "SELECT id FROM team_state WHERE id = 1"
